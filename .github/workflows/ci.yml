name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check dac tests

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate rules (schema + semantics)
        run: python -m dac validate

  test:
    runs-on: ubuntu-latest
    needs: [lint, validate]
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests + rule-vs-sample tests
        run: python -m pytest -v
      - name: Rule results table
        run: python -m dac test >> "$GITHUB_STEP_SUMMARY"

  artifacts:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Convert rules to KQL and SPL
        run: python -m dac convert --target all --out build/queries
      - name: Package Sentinel analytics rules (ARM template)
        run: python -m dac sentinel --out build/sentinel/analytics-rules.json
      - name: Example SIEM migration plan
        run: python -m dac migrate --legacy examples/legacy_splunk_searches.csv --out build/MIGRATION_PLAN.md
      - name: Generate ATT&CK coverage report
        run: |
          python -m dac coverage --out build/COVERAGE.md
          cat build/COVERAGE.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: detections-${{ github.sha }}
          path: build/
