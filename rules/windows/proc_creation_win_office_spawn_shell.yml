title: Office Application Spawning Shell Or Script Host
id: 6a4c8e1f-2b7d-4f93-a5c0-7d3e1b9f5a09
status: test
description: >-
  Detects Word, Excel, PowerPoint, Outlook or Access starting a command shell,
  PowerShell, script host or common LOLBin. This is typical of macro-based
  phishing documents executing a first-stage payload.
author: Dinesh Melimi
date: 2026-10-06
references:
  - https://attack.mitre.org/techniques/T1566/001/
  - https://attack.mitre.org/techniques/T1204/002/
tags:
  - attack.initial-access
  - attack.t1566.001
  - attack.execution
  - attack.t1204.002
  - attack.t1059.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
      - '\OUTLOOK.EXE'
      - '\MSACCESS.EXE'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Legacy add-ins or business macros that shell out; allow-list by command line after review
level: high
