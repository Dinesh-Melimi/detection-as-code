title: AWS CloudTrail Logging Stopped Or Trail Deleted
id: 2c7e4a9b-0d5f-4c12-8b37-d1f9a3e5c207
status: test
description: >-
  Detects StopLogging or DeleteTrail API calls against CloudTrail. Attackers
  disable audit logging to hide subsequent activity in the account.
author: Dinesh Melimi
date: 2026-10-06
references:
  - https://docs.aws.amazon.com/awscloudtrail/latest/APIReference/API_StopLogging.html
  - https://attack.mitre.org/techniques/T1562/008/
tags:
  - attack.defense-evasion
  - attack.t1562.008
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: cloudtrail.amazonaws.com
    eventName:
      - StopLogging
      - DeleteTrail
  condition: selection
falsepositives:
  - Planned trail decommissioning or migration; should be tied to a change ticket
level: high
