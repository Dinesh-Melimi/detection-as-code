title: AWS Root Account Console Login
id: 5d0a2c8e-7f1b-4b3d-9e46-a8c2e4f6b106
status: test
description: >-
  Detects a console sign-in by the AWS account root user. AWS recommends not
  using root for day-to-day work, so any root login should be rare and
  reviewed. Both successful and failed attempts are alerted.
author: Dinesh Melimi
date: 2026-10-06
references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
  - https://attack.mitre.org/techniques/T1078/004/
tags:
  - attack.initial-access
  - attack.privilege-escalation
  - attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: signin.amazonaws.com
    eventName: ConsoleLogin
    userIdentity.type: Root
  condition: selection
falsepositives:
  - Break-glass procedures and tasks that require root (e.g. changing account settings); verify against change records
level: high
